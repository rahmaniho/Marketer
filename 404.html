<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>انتقال به بازارعمده — پلتفرم عمده‌فروشی هوشمند</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f8f7;
        color: #0f172a;
        font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      }
      .box {
        max-width: 460px;
        padding: 28px;
        border-radius: 20px;
        background: #fff;
        border: 1px solid #e2e8f0;
        text-align: center;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      }
      h1 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      p {
        font-size: 13px;
        line-height: 2;
        color: #475569;
        margin: 0 0 14px;
      }
      a {
        display: inline-block;
        background: #0f684c;
        color: #fff;
        text-decoration: none;
        padding: 10px 18px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
      }
      .note {
        margin-top: 14px;
        font-size: 11px;
        color: #94a3b8;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b1220;
          color: #e2e8f0;
        }
        .box {
          background: #0f172a;
          border-color: #1e293b;
        }
        p {
          color: #94a3b8;
        }
      }
    </style>
    <script>
      /*
        صفحه ۴۰۴ برای GitHub Pages.
        این اپلیکیشن از HashRouter استفاده می‌کند؛ بنابراین هر مسیر مستقیم
        (مثل /Marketer/catalog) به مسیر معادل هش‌دار (/Marketer/#/catalog) هدایت می‌شود.
      */
      (function () {
        var base = '/Marketer/';
        var path = window.location.pathname || '/';
        var hash = window.location.hash || '';
        var query = window.location.search || '';

        // اگر آدرس داخل ریشه پروژه است، بخش مربوط به پروژه را جدا کن
        if (path.indexOf(base) === 0) path = path.slice(base.length);

        var target = base + (hash ? hash : '#/' + path.replace(/^\/+/, '')) + query;
        // صفحه‌های ناوبری معمولاً بدون هش و با اسلش تمام می‌شوند
        if (!hash && (path === '' || path === 'index.html')) target = base + '#/' + query;

        try {
          window.location.replace(target);
        } catch (e) {
          /* در صورت خطا، لینک دستی نمایش داده می‌شود */
        }
      })();
    </script>
  </head>
  <body>
    <div class="box">
      <h1>در حال انتقال به بازارعمده…</h1>
      <p>اگر انتقال خودکار انجام نشد، روی دکمه زیر بزنید تا به صفحه اصلی پلتفرم بروید.</p>
      <a href="/Marketer/">ورود به پلتفرم بازارعمده</a>
      <p class="note">پلتفرم B2B عمده‌فروشی هوشمند صنایع غذایی — طراحی و توسعه: کارن سافت (Karen-soft.ir)</p>
    </div>
  </body>
</html>
