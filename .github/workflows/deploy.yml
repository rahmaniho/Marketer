name: Deploy to GitHub Pages

# انتشار خودکار نسخه استاتیک روی شاخه gh-pages
# نکته: در Settings → Actions → General دسترسی «Read and write permissions» را فعال کنید.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: نصب وابستگی‌ها
        run: npm ci --no-audit --no-fund

      - name: ساخت نسخه نهایی (basePath = /Marketer/)
        env:
          PUBLIC_BASE: /Marketer/
        run: npm run build

      - name: افزودن فایل‌های لازم GitHub Pages
        run: |
          # public/404.html توسط Vite در dist قرار می‌گیرد (هدایت مسیرها به مسیر هش‌دار)
          touch dist/.nojekyll

      - name: انتشار روی شاخه gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'نشر خودکار نسخه دمو — کارن سافت (Karen-soft.ir)'
          force_orphan: true
